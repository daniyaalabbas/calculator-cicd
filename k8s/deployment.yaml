apiVersion: apps/v1
kind: Deployment

metadata:
  name: calculator-app

spec:
  replicas: 6

  selector:
    matchLabels:
      app: calculator

  template:
    metadata:
      labels:
        app: calculator

    spec:
      containers:
      - name: calculator
        image: daniyaalabbas/calculator-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: APP_TITLE
          valueFrom:
            configMapKeyRef:
              name: calculator-config
              key: APP_TITLE

        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: calculator-config
              key: ENVIRONMENT
