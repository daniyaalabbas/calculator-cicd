name: Calculator CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t daniyaalabbas/calculator-app:latest \
            -t daniyaalabbas/calculator-app:${{ github.sha }} \
            .

      - name: Push Latest Image
        run: docker push daniyaalabbas/calculator-app:latest

      - name: Push Commit Image
        run: docker push daniyaalabbas/calculator-app:${{ github.sha }}
