name: Calculator CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t daniyaalabbas/calculator-app:latest \
          -t daniyaalabbas/calculator-app:${{ github.sha }} \
          .

      - name: Push Latest
        run: docker push daniyaalabbas/calculator-app:latest

      - name: Push SHA Image
        run: docker push daniyaalabbas/calculator-app:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes

    needs: build

    runs-on: self-hosted

    steps:

      - name: Verify Cluster
        run: |
          kubectl get nodes

      - name: Deploy New Image
        run: |
          kubectl set image deployment/calculator-app \
          calculator=daniyaalabbas/calculator-app:${{ github.sha }}

      - name: Wait For Rollout
        run: |
          kubectl rollout status deployment/calculator-app

      - name: Show Deployment
        run: |
          kubectl get deployment
          kubectl get pods -o wide
