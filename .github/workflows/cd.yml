name: Calculator CD Pipeline

on:
  workflow_run:
    workflows: ["Calculator CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/calculator-app \
          calculator=daniyaalabbas/calculator-app:latest

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/calculator-app --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get deployment
          kubectl get pods -o wide
          kubectl get svc
